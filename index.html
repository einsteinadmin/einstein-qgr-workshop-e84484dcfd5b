<style>
:root{
  --orange-50:#FEF6EC; --orange-100:#FDE3C2; --orange-200:#FABD84; --orange-500:#EF8B22; --orange-700:#D96B10; --orange-900:#CC5500;
  --navy-50:#EEF1F4; --navy-100:#CDD5DA; --navy-200:#9AADB7; --navy-400:#507080; --navy-500:#27343D; --navy-700:#1A2329; --navy-900:#0B1014;
  --blue-50:#EBF4FB; --blue-100:#C3DFEF; --blue-500:#0979C3; --blue-700:#065E9A; --blue-900:#023B63;
  --grey-50:#F4F5F5; --grey-100:#E2E3E4; --grey-200:#C0C2C4; --grey-400:#787C7F; --grey-500:#53575A; --grey-700:#363839; --grey-900:#191A1B;
  --success:#69995D; --error:#CC0100; --text-faint:#5F6468;
  --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(39,52,61,.08); --shadow-md:0 4px 12px rgba(39,52,61,.10); --shadow-lg:0 12px 32px rgba(39,52,61,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--grey-700);background:var(--grey-50);font-size:14px;line-height:1.5}
h1,h2,h3,h4{color:var(--navy-500);font-weight:700}
a{color:var(--blue-500)}
button{font:inherit;cursor:pointer}
::selection{background:var(--blue-100)}

#appHeader{background:var(--navy-500);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-md)}
#appHeader .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#appHeader .brand .bebas{font-family:'Bebas Neue','Roboto',sans-serif;font-size:26px;letter-spacing:.03em;color:#fff}
#appHeader .brand .tag{font-size:12px;color:var(--navy-100)}
#appHeader .savebox{font-size:11px;color:var(--navy-100);text-align:right}
#appHeader .savebox b{color:#fff}
main{max-width:1080px;margin:0 auto;padding:24px 20px 90px}
.view{display:none}
.view.active{display:block}
.muted{color:var(--text-faint)}
.small{font-size:12px}
.tiny{font-size:11px}

#storageWarn{display:none;background:#F8DCDC;color:#8E0000;border:1px solid #E6B2B2;border-radius:var(--radius-md);padding:12px 16px;font-size:12.5px;font-weight:700;margin-bottom:16px}
#storageWarn.show{display:block}

/* ---- Landing: who are you ---- */
.landing-intro{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:24px;margin-bottom:20px}
.landing-intro h2{font-size:20px;margin-bottom:6px}
.landing-intro p{font-size:13px;color:var(--grey-500);max-width:760px}
.leader-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.l-card{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;justify-content:space-between;align-items:center;gap:10px}
.l-card .lname{font-size:14px;font-weight:700;color:var(--navy-500)}
.l-card .lrole{font-size:11.5px;color:var(--grey-400)}
.l-card .open-btn{background:var(--navy-500);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 14px;font-size:11.5px;font-weight:700;white-space:nowrap}
.l-card .open-btn:hover{background:var(--navy-700)}
.l-card .started{font-size:10px;color:var(--success);font-weight:700}

/* ---- Anti-anchoring band ---- */
.privacy-band{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius-md);padding:14px 20px;font-size:12.5px;color:var(--blue-900);margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.privacy-band .pb-ico{font-size:16px;line-height:1.3}

/* ---- Hub head + tiles ---- */
.backlink{background:none;border:none;color:var(--blue-500);font-size:12.5px;font-weight:700;padding:0;margin-bottom:14px;display:inline-block}
.hub-head{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:18px 24px;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.hub-head h2{font-size:21px;margin:0}
.hub-head .sub{font-size:12px;color:var(--grey-400);margin-top:2px}
.hub-head .progress-wrap{display:flex;align-items:center;gap:10px}
.progress-track{width:180px;height:8px;background:var(--grey-100);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--orange-500);transition:width .3s}

.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:26px}
.tile{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow-sm)}
.tile h4{font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:5px}
.tile p{font-size:11.5px;color:var(--grey-400);line-height:1.5}
.tile .tlink{font-size:11.5px;font-weight:700;display:inline-block;margin-top:7px}
.tile.live{border-color:var(--orange-200)}
.tile .now{font-size:9.5px;font-weight:700;background:var(--orange-100);color:var(--orange-900);border-radius:var(--radius-pill);padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
.tile .now.pend{background:var(--grey-100);color:var(--grey-400)}
.tile.soft h4,.tile.soft p{color:var(--grey-400)}
.section.pending{opacity:.55}
.section.pending.locked{opacity:.85}
.section.locked .shead h3{color:var(--grey-400)}
.lock-banner{background:var(--navy-50);border:1px dashed var(--navy-200);border-radius:var(--radius-md);padding:12px 16px;font-size:12.5px;font-weight:700;color:var(--navy-500);margin-bottom:12px}
.lock-list{margin:6px 0 0 18px;font-size:12.5px;color:var(--grey-400)}
.section.pending .ai-line{cursor:default}
.tile .soon{font-size:9.5px;font-weight:700;background:var(--grey-100);color:var(--grey-500);border-radius:var(--radius-pill);padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
.tile.soft{border-style:dashed;background:var(--grey-50)}

/* ---- Debate cards ---- */
.section{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:24px;margin-bottom:16px}
.section > .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px;flex-wrap:wrap}
.section h3{font-size:16px;display:flex;align-items:center;gap:8px}
.section .shelp{font-size:12.5px;color:var(--grey-400);margin-bottom:16px;line-height:1.5;max-width:820px}
.section .done-chip{font-size:10.5px;color:var(--success);font-weight:700}

.q-card{border:1px solid var(--grey-100);border-radius:var(--radius-md);margin-bottom:16px;overflow:hidden}
.q-card .qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px;cursor:pointer;user-select:none}
.q-card .qhead:hover .qtitle{color:var(--blue-700)}
.q-card .qtitle{font-size:15px;font-weight:700;color:var(--navy-500)}
.q-card .qnum{color:var(--orange-900);margin-right:4px}
.q-card .caret{font-size:11px;color:var(--grey-400);white-space:nowrap}
.qsum{font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 10px;white-space:nowrap}
.qsum.voted{background:#E3EEDF;color:#3E6636}
.qsum.open{background:var(--grey-100);color:var(--grey-500)}
.q-card.collapsed .qbody{display:none}
.q-card .qbody{padding:0 20px 20px}
.ctx-block{font-size:13px;color:var(--grey-500);line-height:1.65;margin-bottom:12px}
.ctx-block b{color:var(--navy-500)}
.lean-block{background:var(--orange-50);border:1px solid var(--orange-100);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:14px}
.lean-block .lean-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--orange-900);margin-bottom:6px}
.lean-block .lean-body{font-size:13px;color:var(--navy-500);line-height:1.65}
.lean-block .lean-body ul{margin:6px 0 0 18px}
.lean-block .lean-body li{margin-bottom:3px}
details.lean-reveal{margin-bottom:14px}
details.lean-reveal summary{cursor:pointer;list-style:none;user-select:none;font-size:12.5px;font-weight:700;color:var(--blue-500);background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius-sm);padding:9px 14px;display:inline-block}
details.lean-reveal summary::-webkit-details-marker{display:none}
details.lean-reveal summary:hover{border-color:var(--blue-500)}
details.lean-reveal[open] summary{display:none}
details.lean-reveal .lr-hint{font-weight:400;color:var(--navy-400)}
.lean-none{font-size:12.5px;color:var(--navy-500);background:var(--navy-50);border:1px dashed var(--navy-100);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px}
/* action items */
.ai-draft{font-size:10px;font-weight:700;background:var(--orange-100);color:var(--orange-900);border-radius:var(--radius-pill);padding:2px 9px;text-transform:uppercase;letter-spacing:.04em}
.ai-line{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid var(--grey-50);font-size:13px}
.ai-line:first-of-type{border-top:none}
.ai-line input{width:16px;height:16px;margin-top:2px;flex-shrink:0}
.ai-line.done span{color:var(--grey-400);text-decoration:line-through}
/* prework */
.pw-theme{background:var(--orange-50);border:1px solid var(--orange-100);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:14px;font-size:13px;color:var(--navy-500);line-height:1.6}
.pw-goal{border:1px dashed var(--grey-200);border-radius:var(--radius-md);padding:14px 16px;margin-top:12px}
.pw-goal .pw-num{font-size:10.5px;font-weight:700;color:var(--grey-400);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.pw-goal input[type=text]{width:100%;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;font-size:12.5px;margin-bottom:8px}
.pw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.pw-grid{grid-template-columns:1fr}}
.pw-grid textarea{width:100%;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;font-size:12.5px;resize:vertical;min-height:52px}
.debate-line{font-size:13px;color:var(--navy-500);font-weight:700;background:var(--navy-50);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;line-height:1.55}
.debate-line .dl-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-400);display:block;margin-bottom:3px}

.your-take{border-top:1px dashed var(--grey-200);padding-top:14px}
.your-take .yt-label{font-size:12px;font-weight:700;color:var(--navy-500);margin-bottom:8px}
.chiprow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--grey-200);background:#fff;border-radius:var(--radius-sm);padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--grey-500);text-align:center}
.chip:hover{border-color:var(--navy-400)}
.chip.sel{background:var(--navy-500);border-color:var(--navy-500);color:#fff}
.chip.sel.good{background:var(--success);border-color:var(--success)}
.chip.sel.mid{background:var(--orange-700);border-color:var(--orange-700)}
.chip.sel.bad{background:var(--error);border-color:var(--error)}
.chip.sel.und{background:var(--navy-400);border-color:var(--navy-400)}
.q-block{margin-top:10px}
.q-block label{display:block;font-size:12px;font-weight:700;color:var(--navy-500);margin-bottom:3px}
.q-block label .qhint{font-weight:400;color:var(--grey-400)}
.q-block textarea{width:100%;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:9px 11px;font:inherit;font-size:12.5px;resize:vertical;min-height:64px}

<script>
/* ============ Constants ============ */
// Same storage-prefix family as the QGR Command HQ (index.html) — sibling surface, not a fork.
// October 2026 cycle: NEW key so July saves ("qgrhq-q3-2026-v2-workshop") are never read, overwritten or mixed in.
const LS_KEY = "qgr-workshop-2026-10";
const CYCLE = "2026-10";
const QUARTER = "October 2026 QGR (Q3 review · Q4 planning)";
/* ---- UNLOCK SWITCHES (Albert flips these; nothing else needs touching) ----
   BALLOT_UNLOCKED: debate ballot + pick-5 goals. Set true AFTER Cameron and Paul's 10/19
   walk (around Wed 10/21) and after DEBATES, CORE_QIDS and SHORTLIST below are refilled.
   BUILDSHEET_OPEN: theme build sheet. Off this cycle (theme ideas go in the Meeting OS
   checklist); refill TRACKS + THEME_WORKING_NAME before turning on. */
const BALLOT_UNLOCKED = false;
const BUILDSHEET_OPEN = false;
const UNLOCK_BANNER = "Moved to Meeting OS this cycle: QGR prep \u2192 Ballot + pick your 5. It opens there after Cameron and Paul\u2019s 10/19 walk";

const LEADERS = [
  { id:"cameron", name:"Cameron Brown",  role:"CEO" },
  { id:"paul",    name:"Paul Morin",     role:"CFO / COO" },
  { id:"amanda",  name:"Amanda Ware",    role:"Director of CX" },
  { id:"brian",   name:"Brian Herzig",   role:"CTXH Regional Manager" },
  { id:"mike",    name:"Mike Vandenbroader", role:"DFWT Regional Manager · Head of Ops" },
  { id:"matisen", name:"Matisen Harper", role:"Director of IT" },
  { id:"anne",    name:"Anne Bosse",     role:"Director of Employee Experience" }
];

/* ============================================================
   DEBATE SEED — EMPTY for the October 2026 cycle. October's debate
   questions do not exist yet (they come out of Cameron and Paul's 10/19
   walk). Refill this array, add the core ids to CORE_QIDS, then set
   BALLOT_UNLOCKED = true. Shape of one entry:
     { id, title, context(html), lean(html|null), leanNote?(html), options?[{v,label,cls,title}],
       debate(html), forLeaders?:[leaderId], openEnded?:true }
   The lean is displayed as a CURRENT LEAN, never a decision — the label
   is baked into the UI. July's 9 questions are preserved in
   archive/2026-q3-cycle-july-tools/.
   ============================================================ */
const DEBATES = [];

/* ------------------------------------------------------------
   CORE vs OPTIONAL. Core questions are the ones everyone has to
   answer — they're the only ones the progress meter counts. The
   rest still render, still export, just marked "optional" so a
   long ballot doesn't produce eight rushed answers.
   ⚠ Cameron: add/remove ids here to change what counts as core.
   ------------------------------------------------------------ */
const CORE_QIDS = new Set([
  // October core question ids go here when DEBATES is refilled (Amanda-targeted ones included).
]);
function isCore(d){ return CORE_QIDS.has(d.id); }

/* A question with `forLeaders` renders ONLY for those leaders. Not hidden
   behind anything — simply not built, not counted, not exported for anyone
   else, so no one votes on a question about somebody else's department. */
function debatesFor(leaderId){
  return DEBATES.filter(d=>!d.forLeaders || (leaderId && d.forLeaders.indexOf(leaderId) !== -1));
}

/* ============================================================
   THEME BUILD SHEET — GRAYED this cycle (BUILDSHEET_OPEN = false).
   October theme ideas are collected in the Meeting OS checklist, so this
   section shows a one-line note instead. Code paths are intact: refill
   TRACKS + THEME_WORKING_NAME and flip BUILDSHEET_OPEN to revive.
   Shape of one track: { id, label, icon, gate:true|false, prompt(html), ph }
   (`gate:true` = this role gets Green / Super Green inputs). July's five
   role tracks are preserved in archive/2026-q3-cycle-july-tools/.
   ============================================================ */
const THEME_WORKING_NAME = "";
const TRACKS = [];

// Financial deck: set to the Cloudflare-gated URL once Cameron finalizes + gates the deck
// (Q1 pattern). Tile auto-links when non-null; until then it shows "gated link lands here."
const FIN_PACKET_URL = null;
// QG Success Tracker — mirrored into the QGR Command repo on deploy (canonical:
// Supporting Projects/Cascading Goals Tracker/einstein-qg-tracker.html)
const QG_TRACKER_URL = "https://einsteinadmin.github.io/einstein-qgr-command-7b1cbc850326/einstein-qg-tracker.html";

const CORE_VALUES = [
  "Communicate clearly and with kindness",
  "Hustle but don't rush",
  "Ownership over results",
  "Improve with Enthusiasm",
  "Conscientious attention to detail",
  "Elevate attitudes",
  "Support Generously"
];
const CV_ANCHORS = {1:"active problem",2:"below the bar",3:"meets the bar",4:"strong, with named opportunities",5:"the standard others get pointed to"};
const CV_SUBS = {1:"problem",2:"below bar",3:"meets bar",4:"strong",5:"the standard"};
const CV_OPTIONS = [1,2,3,4,5].map(n=>({v:String(n),label:String(n),sub:CV_SUBS[n],cls:n>=4?"good":n===3?"mid":"bad",title:CV_ANCHORS[n]}));

/* Per-leader data-collection action items — EMPTY for October. The July list
   (packet numbers, /status pushes, praise counts) was stale, so the section
   is a grayed placeholder until Cameron writes the October list. Shape:
   { _all:[text,...], <leaderId>:[text,...] } — done-state saves per leader. */
const ACTION_ITEMS = { _all: [] };

/* ============================================================
   Q4 SHORTLIST — EMPTY for the October cycle. It is built from Cameron and
   Paul's 10/19 walk of the backlog shortlist (~Wed 10/21). Refill, then set
   BALLOT_UNLOCKED = true. Shape: SHORTLIST[leaderId] = [
     { k:"<pulse id or CONSOL-id>", name:"…", pulse:"<pulse id>|null", shared?:["leaderId",…] }, … ]
   Deliberate: NO draft Green/Super Green bars and NO critical flags are shown —
   every leader writes their own from blank. July's shortlist is preserved in
   archive/2026-q3-cycle-july-tools/.
   ============================================================ */
const MB_BOARD_URL = "https://einsteinmoving.monday.com/boards/18408300070/pulses/";
const SHORTLIST = {};
const PICK_MAX = 5;
/* Route-a-card targets — each leader's directs, for the "didn't make my five" dropdown.
   Refreshed 10/5/2026 to the current org (people skill + org chart): Calvin Hughes = N. Austin Flex under Daniel; Hector Zavala = S. Austin Ops; Jake Petersen = new S. Austin FM (Cameron 10/5);
   Daniel Behseresht is the N. Austin BM (moved from S. Austin OM); Tampa (Steven Anderson BM,
   Shane Heaberlin Ops Mgr) sits under Mike. */
const DIRECTS = {
  cameron: ["Amanda", "Brian", "Mike", "Matisen", "Anne", "Paul"],
  paul:    ["Ben (Prosper)"],
  amanda:  ["Nhel", "Carly"],
  // Brian + Mike get their FULL manager seats (BM + OM + FM), mirroring the mgr-AAR tool's named roster.
  brian:   ["Daniel Behseresht (N. Austin)", "Nick Dagel (N. Austin)", "Rance Pope (N. Austin)", "Calvin Hughes (N. Austin Flex)",
            "Chris Anderson (S. Austin)", "Hector Zavala (S. Austin Ops)", "Jake Petersen (S. Austin FM)", "Jespah Lara (S. Austin Flex)",
            "Frank Williams (Leander)", "Garrison Cobe (Leander)",
            "Dustin Street (San Antonio)", "Lukas Konrad (San Antonio)", "Cameron Klepac (San Antonio)",
            "Sergio Buenrostro (Houston)", "Joel Villatoro (Houston)", "Alex Tran (Houston)"],
  mike:    ["Chris Beattie (Dallas)", "Landon Vaughan (Dallas)", "Tabi Enoh (Dallas)",
            "Grant Hardison (Fort Worth)", "Erik Orama (Fort Worth)",
            "Khevan Dueck (McKinney)", "Zachary Krodel (McKinney)",
            "Jack Davis (Garland)",
            "Steven Anderson (Tampa)", "Shane Heaberlin (Tampa)"],
  matisen: ["Fabian"],
  anne:    ["Jalissa"]
};
function shortlistFor(leaderId){ return SHORTLIST[leaderId] || []; }
function pickTargetFor(leaderId){ return Math.min(PICK_MAX, shortlistFor(leaderId).length); }

/* ============================================================
   YOUR DIRECTS' Q4 SLATE — five leaders (amanda, anne, matisen, mike,
   brian) draft candidate Q4 goals for their OWN directs. DRAFTS ONLY —
   finalized in the room. LIVE from day one in the October cycle.
   July's seeded candidate cards (they came from the July triage walk) are
   CLEARED: leaders add their own rows; cards a leader routes from their
   pick-5 appear here automatically once the ballot unlocks (~10/21).
   ============================================================ */
const DIRECT_SLATE_LEADERS = ["amanda","anne","matisen","mike","brian"];
function isDirectSlateLeader(id){ return DIRECT_SLATE_LEADERS.indexOf(id) !== -1; }
/* Which directs each of the five sees (checked 10/5/2026 against the org chart). Amanda's includes Tet (sales
   enablement, under Nhel) — she answers for the sales org. Mike/Brian
   get their full FLM rosters straight from DIRECTS (already the
   mgr-AAR-parity roster) — no separate list to maintain. */
const DIRECT_SLATE_ROSTER = {
  amanda:  ["Nhel", "Tet", "Carly"],
  anne:    ["Jalissa"],
  matisen: ["Fabian"]
};
function directRosterFor(leaderId){
  if(leaderId==="mike" || leaderId==="brian") return DIRECTS[leaderId] || [];
  return DIRECT_SLATE_ROSTER[leaderId] || [];
}
/* Seeds are EMPTY for October. Shape if ever refilled:
   { "<direct name>": [ {code:"MB-<pulse>", pulse:"<pulse id>|null", name:"…"}, … ] } */
const SEED_DIRECT_CANDIDATES = {};
function seedCandidatesFor(directName){ return SEED_DIRECT_CANDIDATES[directName] || []; }
/* Cards a leader routed to a direct via the pick-5 (empty until the ballot unlocks) "didn't make my five"
   dropdown — read live off THIS leader's own goalwork.routes, same
   stored state the goal module uses. Deduped against seeds by pulse id. */
function routedCardsFor(leader, ballot, directName){
  const gw = (ballot && ballot.goalwork) || {};
  const routes = gw.routes || {};
  const picks = gw.picks || [];
  const target = "direct:" + directName;
  return shortlistFor(leader.id).filter(c => routes[c.k] === target && picks.indexOf(c.k) === -1);
}
function directSlateFor(ballot, directName){
  if(!ballot.directSlates) ballot.directSlates = {};
  if(!ballot.directSlates[directName]) ballot.directSlates[directName] = { overrides:{}, additions:[], note:"" };
  const ds = ballot.directSlates[directName];
  if(!ds.overrides) ds.overrides = {};
  if(!ds.additions) ds.additions = [];
  if(ds.note == null) ds.note = "";
  return ds;
}
function dsOverride(ds, code){ if(!ds.overrides[code]) ds.overrides[code] = {}; return ds.overrides[code]; }
/* Unified candidate list for one direct: seeds, then routed cards not
   already seeded (by pulse id), then the leader's own added rows. */
function candidatesForDirect(leader, ballot, directName){
  const ds = directSlateFor(ballot, directName);
  const seeds = seedCandidatesFor(directName);
  const seedPulses = new Set(seeds.map(s=>s.pulse).filter(Boolean));
  const seedCodes = new Set(seeds.map(s=>s.code));
  const routed = routedCardsFor(leader, ballot, directName).filter(c => !seedCodes.has(c.k) && !(c.pulse && seedPulses.has(c.pulse)));
  const list = [];
  seeds.forEach(s=>{
    const ov = dsOverride(ds, s.code);
    list.push({ code:s.code, name:s.name, pulse:s.pulse||null, why:ov.why||"", critical:!!ov.critical, removed:!!ov.removed, source:"seed" });
  });
  routed.forEach(c=>{
    const ov = dsOverride(ds, c.k);
    list.push({ code:c.k, name:c.name, pulse:c.pulse||null, why:ov.why||"", critical:!!ov.critical, removed:!!ov.removed, source:"routed" });
  });
  ds.additions.forEach((a,i)=>{
    list.push({ code:"own:"+i, name:a.name||"", pulse:null, why:a.why||"", critical:!!a.critical, removed:!!a.removed, source:"own", _addIdx:i });
  });
  return list;
}

const POSITIONS = [
  { v:"agree",     label:"Agree with the lean",    cls:"good", title:"The lean as written is the right call" },
  { v:"agree-mod", label:"Agree, with changes",    cls:"mid",  title:"Right direction, but I'd change something — say what in your reasoning" },
  { v:"disagree",  label:"Disagree",               cls:"bad",  title:"I'd go a different way — make the case in your reasoning" },

/* ============ State ============ */
let STATE = { leaders:{}, lastSaved:null };
let currentLeaderId = null;
let saveTimer = null;
let EXPANDED = new Set();

function loadState(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) STATE = Object.assign(STATE, JSON.parse(raw)); }catch(e){ console.warn("state load failed", e); }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    STATE.lastSaved = new Date().toISOString();
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(STATE));
      renderSaveStamp();
    }catch(e){
      const w = document.getElementById("storageWarn");
      w.textContent = "⚠ NOT SAVING — this browser is blocking local storage. Don't close this tab. Export your ballot from the bottom section now and keep the file.";
      w.classList.add("show");
      document.getElementById("saveStamp").textContent = "NOT SAVING";
    }
  }, 250);
}
function renderSaveStamp(){
  const el = document.getElementById("saveStamp");
  el.textContent = STATE.lastSaved ? "Saved " + new Date(STATE.lastSaved).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "—";
}
function emptyBallot(leader){
  return {
    quarter: QUARTER,
    votes: {},   // debate id -> { position, reasoning }
    choices: { items:{}, itemNotes:{} },   // core value -> score 1-5, note
    celebrations: { celebration:"", prizes:"" },
    bestThings: { items:[{kind:"",story:"",photos:[]},{kind:"",story:"",photos:[]},{kind:"",story:"",photos:[]}] }, // v1.11 — photos = [{name,dataUrl}], compressed in-browser
    legend: { who:"", story:"" },           // v1.11 — Legend of the Quarter: who = leader id (never self)
    actions: {},                            // action-item text -> true when done
    prework: { own:"", goals:[{},{},{}] },  // LEGACY (pre-v1.8) — kept so old saves round-trip; no longer rendered
    goalwork: { picks:[], crits:[], bars:{}, routes:{}, additions:[] }, // pick-5 module: bars[k]={green,superGreen,measure}, routes[k]=string, additions=[{name,why,green,superGreen,measure}]
    buildsheet: { themeName:"", tracks:{} },// theme by role (grayed this cycle) — track id -> {take, green, superGreen}
    directSlates: {}, // your directs' Q4 slate (5-leader module) — directName -> {overrides:{code->{why,critical,removed}}, additions:[{name,why,critical,removed}], note}
    startedAt: null,
    leader: { id: leader.id, name: leader.name, role: leader.role }
  };
}
function getBallot(leader){
  if(!STATE.leaders[leader.id]) STATE.leaders[leader.id] = emptyBallot(leader);
  const b = STATE.leaders[leader.id];
  if(!b.votes) b.votes = {};
  // backfill fields added after V1 so early saves never crash
  if(!b.choices) b.choices = {items:{},itemNotes:{}};
  if(!b.choices.itemNotes) b.choices.itemNotes = {};
  if(!b.celebrations) b.celebrations = {celebration:"",prizes:""};
  if(!b.bestThings) b.bestThings = {items:[]};
  if(!b.bestThings.items) b.bestThings.items = [];
  while(b.bestThings.items.length < 3) b.bestThings.items.push({kind:"",story:"",photos:[]});
  b.bestThings.items.forEach(it=>{ if(!it.photos) it.photos = []; });
  if(!b.legend) b.legend = {who:"",story:""};
  if(!b.actions) b.actions = {};
  if(!b.prework) b.prework = {own:"",goals:[{},{},{}]};
  while(b.prework.goals.length < 3) b.prework.goals.push({});
  if(!b.goalwork) b.goalwork = {picks:[],crits:[],bars:{},routes:{},additions:[]};
  if(!b.goalwork.picks) b.goalwork.picks = [];
  if(!b.goalwork.crits) b.goalwork.crits = [];
  if(!b.goalwork.bars) b.goalwork.bars = {};
  if(!b.goalwork.routes) b.goalwork.routes = {};
  if(!b.goalwork.additions) b.goalwork.additions = [];
  if(!b.buildsheet) b.buildsheet = {themeName:"",tracks:{}};
  if(!b.buildsheet.tracks) b.buildsheet.tracks = {};
  if(!b.directSlates) b.directSlates = {};
  return b;
}
function actionsFor(leaderId){ return (ACTION_ITEMS._all||[]).concat(ACTION_ITEMS[leaderId]||[]); }
function posLabelFor(d, v){ const p = (d.options||POSITIONS).find(x=>x.v===v); return p ? p.label : null; }
function leaderById(id){ return LEADERS.find(l=>l.id===id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function stripHtml(s){ const d=document.createElement("div"); d.innerHTML=s; return (d.textContent||"").replace(/\s+/g," ").trim(); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2400);
}

/* ============ Progress ============ */
function trackVal(ballot, tid, k){
  const tracks = (ballot && ballot.buildsheet && ballot.buildsheet.tracks) || {};
  return (tracks[tid]||{})[k] || "";
}
/* Build sheet is worth 3 progress points, not one per track — nobody is
   expected to have a real view on all five roles. The three: name the theme,
   write up at least two tracks, set at least one Green/Super Green pair. */
function buildsheetPoints(ballot){
  const bs = ballot && ballot.buildsheet;
  if(!bs) return 0;
  let pts = 0;
  if((bs.themeName||"").trim()) pts++;
  if(TRACKS.filter(t=>trackVal(ballot,t.id,"take").trim()).length >= 2) pts++;
  if(TRACKS.some(t=>t.gate && trackVal(ballot,t.id,"green").trim() && trackVal(ballot,t.id,"superGreen").trim())) pts++;
  return pts;
}
const BUILDSHEET_POINTS = 3;

/* Pick-5 goal module — 3 progress points: picks made · 2 criticals named ·
   every picked goal fully barred (Green + Super Green + How measured). */
function barsComplete(gw, k){
  const b = (gw.bars||{})[k] || {};
  return !!((b.green||"").trim() && (b.superGreen||"").trim() && (b.measure||"").trim());
}
function goalworkPoints(ballot){
  const lid = (ballot && ballot.leader && ballot.leader.id) || null;
  const gw = (ballot && ballot.goalwork) || {};
  const picks = gw.picks || [];
  let pts = 0;
  if(lid && picks.length >= pickTargetFor(lid)) pts++;
  if((gw.crits||[]).length === 2) pts++;
  if(picks.length && picks.every(k=>barsComplete(gw, k))) pts++;
  return pts;
}
const GOALWORK_POINTS = 3;

/* Best Things + Legend are STANDARD in October (Cameron): 3 points for the three
   stories (one each) + 1 for the legend (a pick AND a story). */
const BESTTHINGS_POINTS = 3;
const LEGEND_POINTS = 1;
function bestThingsPoints(ballot){
  const items = (ballot && ballot.bestThings && ballot.bestThings.items) || [];
  return Math.min(BESTTHINGS_POINTS, items.filter(it=>it && (it.story||"").trim()).length);
}
function legendPoints(ballot){
  const lg = (ballot && ballot.legend) || {};
  return (lg.who && (lg.story||"").trim()) ? LEGEND_POINTS : 0;
}
function ballotProgress(ballot){
  // Computed over what is OPEN. Always open: CHOICES (a score with its note per value),
  // best things (3) and the legend (1). Counted only when unlocked: CORE ballot questions
  // (position + reasoning; open-ended = reasoning only) and the pick-5 goal module (3).
  // The build sheet's 3 points count only if BUILDSHEET_OPEN.
  // NOTE: callers may pass a RAW stored ballot (e.g. renderLanding), so guard every
  // field here — a legacy save missing a field must never throw and blank the page.
  const lid = (ballot && ballot.leader && ballot.leader.id) || null;
  const core = BALLOT_UNLOCKED ? debatesFor(lid).filter(isCore) : [];
  const votes = (ballot && ballot.votes) || {};
  const items = (ballot && ballot.choices && ballot.choices.items) || {};
  const notes = (ballot && ballot.choices && ballot.choices.itemNotes) || {};
  let done = 0;
  let total = core.reduce((n,d)=>n + (d.openEnded?1:2), 0) + CORE_VALUES.length + BESTTHINGS_POINTS + LEGEND_POINTS
    + (BUILDSHEET_OPEN ? BUILDSHEET_POINTS : 0) + (BALLOT_UNLOCKED ? GOALWORK_POINTS : 0);
  core.forEach(d=>{
    const v = votes[d.id]||{};
    if(!d.openEnded && v.position) done++;
    if((v.reasoning||"").trim()) done++;
  });
  CORE_VALUES.forEach(cv=>{ if(items[cv] && (notes[cv]||"").trim()) done++; });
  done += bestThingsPoints(ballot);
  done += legendPoints(ballot);
  if(BUILDSHEET_OPEN) done += buildsheetPoints(ballot);
  if(BALLOT_UNLOCKED) done += goalworkPoints(ballot);
  return total ? Math.round(done/total*100) : 0;
}
function choicesDone(ballot){ return CORE_VALUES.every(cv=>ballot.choices.items[cv]); }
function questionAnswered(ballot, d){
  const v = ballot.votes[d.id]||{};
  return (d.openEnded || !!v.position) && !!(v.reasoning||"").trim();
}
function votedCount(ballot, leaderId){
  return debatesFor(leaderId).filter(d=>questionAnswered(ballot, d)).length;
}
function coreOpenCount(ballot, leaderId){
  if(!BALLOT_UNLOCKED) return 0;
  return debatesFor(leaderId).filter(d=>isCore(d) && !questionAnswered(ballot, d)).length;
}

/* ============ Leader hub ============ */
function openLeader(id){
  currentLeaderId = id;
  const leader = leaderById(id);
  const ballot = getBallot(leader);
  if(!ballot.startedAt){ ballot.startedAt = new Date().toISOString(); queueSave(); }
  const firstOpen = debatesFor(id).find(d=>!questionAnswered(ballot, d));
  EXPANDED = new Set(firstOpen ? [firstOpen.id] : []);
  document.getElementById("view-landing").classList.remove("active");
  document.getElementById("view-hub").classList.add("active");
  renderHub();
  window.scrollTo(0,0);
}
function backToLanding(){
  currentLeaderId = null;

}

    '<div class="shelp">Part of your prep this cycle &mdash; it counts in your progress bar. Pick <b>one person on the Roundtable</b> who was your legend of the quarter &mdash; the teammate whose Q3 you\'d want the whole room to hear about. Then <b>write up the story to share</b>: what they did, what it took, and what it made possible. You\'ll tell it in the room, so write it in your telling voice. There\'s no wrong pick and no vote &mdash; if three people name the same legend, that\'s three great stories.</div>'+
    '<div class="q-block"><label>My legend</label>'+
    '<div class="chiprow">'+LEADERS.filter(l=>l.id!==leader.id).map(l=>
      '<button class="chip'+(lg.who===l.id?' sel good':'')+'" data-lgwho="'+esc(l.id)+'" title="'+esc(l.role)+'">'+esc(l.name.split(" ")[0])+'</button>'
    ).join("")+'</div></div>'+
    '<div class="q-block"><label>The story '+(picked?'<span class="qhint">&mdash; why '+esc(picked.name.split(" ")[0])+' is your legend</span>':'<span class="qhint">&mdash; pick your legend above first if you want, but the story can come first too</span>')+'</label>'+
    '<textarea data-lgstory placeholder="The specific moment or run of work that earned it — what they did, what it took, what it changed.">'+esc(lg.story||"")+'</textarea></div>'+
    '<div class="cos-row"><button id="btnLgCos">🎙 Copy COS prompt for your legend story</button>'+
    '<span class="cos-hint">Hands your pick and rough notes to your AI chief of staff to help shape into a story worth telling aloud.</span></div>'+
    '</div>';
  return html;
}

/* Browser-side photo shrink: max 1280px long edge, JPEG — keeps three photos
   per item comfortably inside localStorage. HEIC in Chrome fails to decode →
   graceful toast (Safari decodes HEIC natively). */
function compressImageFile(file, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX = 1280;
      let w = img.width, h = img.height;
      if(Math.max(w,h) > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = ()=>toast("Couldn't read that image — try a JPG or PNG (iPhone HEIC needs Safari)");
    img.src = reader.result;
  };
  reader.onerror = ()=>toast("Couldn't read that file");
  reader.readAsDataURL(file);
}

  wrap.querySelectorAll("[data-reason]").forEach(ta=>{
    ta.addEventListener("input", ()=>{

      queueSave();
    });
  });
  wrap.querySelectorAll("[data-action]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      if(cb.checked) ballot.actions[cb.dataset.action] = true;
      else delete ballot.actions[cb.dataset.action];
      queueSave(); renderHub();
    });
  });
  /* ---- Pick-5 goal module ---- */
  const gw = ballot.goalwork;
  wrap.querySelectorAll("[data-gpick]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.gpick;
      const i = gw.picks.indexOf(k);
      if(i !== -1){
        gw.picks.splice(i,1);
        const ci = gw.crits.indexOf(k); if(ci !== -1) gw.crits.splice(ci,1);
      } else {
        if(gw.picks.length >= pickTargetFor(leader.id)){
          toast("That's "+pickTargetFor(leader.id)+" already — unpick one first. Cut, don't collect.");
          return;
        }
        gw.picks.push(k);
        delete gw.routes[k];
      }
      queueSave(); renderHub();
    });
  });
  wrap.querySelectorAll("[data-gcrit]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.gcrit;
      const i = gw.crits.indexOf(k);
      if(i !== -1) gw.crits.splice(i,1);
      else {
        if(gw.crits.length >= 2){ toast("Two criticals max — that's the point. Swap one out."); return; }
        gw.crits.push(k);
      }
      queueSave(); renderHub();
    });
  });
  wrap.querySelectorAll("[data-gbar]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const idx = ta.dataset.gbar.lastIndexOf(":");
      const k = ta.dataset.gbar.slice(0,idx), f = ta.dataset.gbar.slice(idx+1);
      if(!gw.bars[k]) gw.bars[k] = {};
      gw.bars[k][f] = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-groute]").forEach(sel=>{
    sel.addEventListener("change", ()=>{
      if(sel.value) gw.routes[sel.dataset.groute] = sel.value;
      else delete gw.routes[sel.dataset.groute];
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-gadd]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const idx = el.dataset.gadd.indexOf(":");
      const i = Number(el.dataset.gadd.slice(0,idx)), f = el.dataset.gadd.slice(idx+1);
      if(!gw.additions[i]) gw.additions[i] = {};
      gw.additions[i][f] = el.value;
      queueSave();

  const addBtn = document.getElementById("btnAddGoal");

  wrap.querySelectorAll("[data-gdel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const i = Number(btn.dataset.gdel);

      gw.crits = gw.crits.filter(k=>k!=="add:"+i).map(k=>{
        if(k.indexOf("add:")===0){ const n = Number(k.slice(4)); if(n>i) return "add:"+(n-1); }

  const gwCos = document.getElementById("btnGwCos");

    copyText(buildGoalworkCosPrompt(leader, ballot), "Goals COS prompt copied — paste it to your AI chief of staff");

  /* ---- Your Directs' Q3 Slate module ---- */
  if(isDirectSlateLeader(leader.id)){

    });
    wrap.querySelectorAll("[data-dsdel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{

    wrap.querySelectorAll("[data-dsadd]").forEach(btn=>{

    wrap.querySelectorAll("[data-dsnote]").forEach(ta=>{

  wrap.querySelectorAll("[data-cv]").forEach(btn=>{

      else ballot.choices.items[cv] = val;
      queueSave(); renderHub();

  wrap.querySelectorAll("[data-cvnote]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      ballot.choices.itemNotes[ta.dataset.cvnote] = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-celeb]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      ballot.celebrations[ta.dataset.celeb] = ta.value;
      queueSave();
    });
  });
  /* ---- Best things (v1.11) ---- */
  const btItems = ballot.bestThings.items;
  wrap.querySelectorAll("[data-btstory]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      btItems[Number(ta.dataset.btstory)].story = ta.value;

  });
  wrap.querySelectorAll("[data-btkind]").forEach(btn=>{
    btn.addEventListener("click", ()=>{

  wrap.querySelectorAll("[data-btadd]").forEach(btn=>{

function copyText(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast(okMsg), ()=>toast("Copy blocked — select it from the preview below"));
  } else {
    const pv = document.getElementById("mdPreview");
    if(pv){ pv.value = text; pv.classList.add("show"); }
    toast("Copy not available in this browser — select it from the preview below");
  }
}

/* ============ Export builders ============ */
function buildJsonBallot(leader, ballot){
  return {
    // v8 (Oct 2026) = v7 shape unchanged, plus cycle + locked flags. Readers matching the einstein-qgr-ballot/ prefix still work.
    schema: "einstein-qgr-ballot/v8",
    cycle: CYCLE,
    locked: { ballotAndGoals: !BALLOT_UNLOCKED, buildsheet: !BUILDSHEET_OPEN },
    exportedAt: new Date().toISOString(),
    quarter: QUARTER,
    leader: { id: leader.id, name: leader.name, role: leader.role },
    choices: CORE_VALUES.map(cv=>({ value: cv, score: ballot.choices.items[cv]?Number(ballot.choices.items[cv]):null, note: (ballot.choices.itemNotes[cv]||"").trim() })),
    celebrations: { celebration: (ballot.celebrations.celebration||"").trim(), prizes: (ballot.celebrations.prizes||"").trim() },
    // v1.11 — photos ride INSIDE this file as embedded data-URLs; the room
    // wall page (qgr-celebration-wall.html) renders them straight from the drop.
    bestThings: ballot.bestThings.items.map((it,i)=>({
      n: i+1,
      kind: it.kind||null,
      story: (it.story||"").trim(),
      photos: (it.photos||[]).map(p=>({ name: p.name||null, dataUrl: p.dataUrl }))
    })).filter(it=>it.story||it.photos.length),
    legend: (function(){
      const lg = ballot.legend||{};
      if(!lg.who && !(lg.story||"").trim()) return null;
      const who = lg.who ? leaderById(lg.who) : null;
      return { whoId: lg.who||null, whoName: who?who.name:null, story: (lg.story||"").trim() };
    })(),
    actionItems: actionsFor(leader.id).map(t=>({ item: t, done: !!ballot.actions[t] })),
    goals: (function(){
      const gw = ballot.goalwork;
      const cards = shortlistFor(leader.id);
      const cardOf = k => cards.find(c=>c.k===k);
      return {
        pickTarget: pickTargetFor(leader.id),
        picked: gw.picks.map(k=>{
          const c = cardOf(k) || {name:k};
          const b = gw.bars[k]||{};
          return { key:k, name:c.name, pulse:c.pulse||null, shared:c.shared||null,
                   critical: gw.crits.indexOf(k)!==-1,
                   green:(b.green||"").trim(), superGreen:(b.superGreen||"").trim(), howMeasured:(b.measure||"").trim() };
        }),
        routed: cards.filter(c=>gw.picks.indexOf(c.k)===-1).map(c=>({
          key:c.k, name:c.name, pulse:c.pulse||null,
          route: gw.routes[c.k]||"room-decides"
        })),
        additions: gw.additions.map((g,i)=>({
          name:(g.name||"").trim(), why:(g.why||"").trim(),
          critical: gw.crits.indexOf("add:"+i)!==-1, flaggedForRoom: true,
          green:(g.green||"").trim(), superGreen:(g.superGreen||"").trim(), howMeasured:(g.measure||"").trim()
        })).filter(g=>g.name)
      };
    })(),
    // legacy pre-v1.8 scaffold — carried only if an old save actually wrote something there
    legacyPrework: (function(){
      const pw = ballot.prework||{};
      const goals = (pw.goals||[]).filter(g=>(g.idea||"").trim()||(g.green||"").trim()||(g.superGreen||"").trim());
      if(!(pw.own||"").trim() && !goals.length) return null;
      return { themeOwnership:(pw.own||"").trim(),
               draftGoals: goals.map(g=>({ idea:(g.idea||"").trim(), green:(g.green||"").trim(), superGreen:(g.superGreen||"").trim() })) };
    })(),
    buildsheet: {
      themeName: (ballot.buildsheet.themeName||"").trim(),
      workingName: THEME_WORKING_NAME,
      tracks: TRACKS.map(t=>({
        id: t.id, label: t.label,
        take: trackVal(ballot,t.id,"take").trim(),
        green: t.gate ? trackVal(ballot,t.id,"green").trim() : null,
        superGreen: t.gate ? trackVal(ballot,t.id,"superGreen").trim() : null
      })).filter(t=>t.take || t.green || t.superGreen)
    },
    directSlates: isDirectSlateLeader(leader.id) ? directRosterFor(leader.id).map(name=>{
      const ds = directSlateFor(ballot, name);
      const cands = candidatesForDirect(leader, ballot, name)
        .map(c=>({ name:(c.name||"").trim(), pulse:c.pulse||null, why:(c.why||"").trim(), critical:!!c.critical, removed:!!c.removed, source:c.source }))
        .filter(c=>c.name);
      return { direct: name, candidates: cands, note: (ds.note||"").trim() };
    }) : [],
    ballot: debatesFor(leader.id).map(d=>{
      const v = ballot.votes[d.id]||{};
      return {
        id: d.id, title: d.title,
        core: isCore(d),
        openEnded: !!d.openEnded,
        targeted: !!d.forLeaders,
        question: stripHtml(d.debate),
        leanShown: d.lean ? stripHtml(d.lean) : null,   // snapshot of the lean the leader saw (null = no lean written, by design)
        leanRevealed: d.lean ? !!v.leanRevealed : null, // v1.10.1: did they open the lean before export (blind-first flow)
        position: v.position||null,
        positionLabel: v.position ? posLabelFor(d, v.position) : null,
        reasoning: (v.reasoning||"").trim()
      };
    }),
    startedAt: ballot.startedAt||null
  };
}
function buildMarkdown(leader, ballot){
  const d = new Date().toISOString().slice(0,10);
  let md = "# QGR Hub — "+leader.name+" — "+d+"\n*"+leader.role+" · October 2026 QGR (10/27–28)*\n\n";
  if(!BALLOT_UNLOCKED) md += "_Debate ballot + Q4 goals: in Meeting OS this cycle (QGR prep → Ballot + pick your 5)._\n\n";
  debatesFor(leader.id).forEach((q,i)=>{
    const v = ballot.votes[q.id]||{};
    md += "## "+(i+1)+" · "+q.title+(isCore(q)?"":" _(optional)_")+"\n";
    md += "- The "+(q.openEnded?"ask":"debate")+": "+stripHtml(q.debate)+"\n";
    if(!q.openEnded) md += "- **My position: "+(v.position ? posLabelFor(q, v.position) : "—")+"**\n";
    md += "- My "+(q.openEnded?"answer":"reasoning")+": "+((v.reasoning||"").trim()||"—")+"\n\n";
  });
  const bs = ballot.buildsheet;
  if(BUILDSHEET_OPEN){
  md += "## Theme build sheet\n";
  md += "- Theme name: "+((bs.themeName||"").trim()||"— (working name: "+THEME_WORKING_NAME+")")+"\n";
  TRACKS.forEach(t=>{
    const take = trackVal(ballot,t.id,"take").trim();
    const green = trackVal(ballot,t.id,"green").trim();
    const sg = trackVal(ballot,t.id,"superGreen").trim();
    if(!take && !green && !sg) return;
    md += "- **"+t.label+":** "+(take||"—")+"\n";
    if(t.gate && (green||sg)) md += "  - Green: "+(green||"—")+" · Super Green: "+(sg||"—")+"\n";
  });
  md += "\n";
  }
  md += "## CHOICES self-eval (1–5)\n";
  CORE_VALUES.forEach(cv=>{
    const s = ballot.choices.items[cv], note = (ballot.choices.itemNotes[cv]||"").trim();
    md += "- "+cv+": "+(s||"—")+(note?" — "+note:"")+"\n";
  });
  md += "\n## Celebrations & prizes (Q4 theme)\n";
  md += "- Celebration ideas: "+((ballot.celebrations.celebration||"").trim()||"—")+"\n";
  md += "- Prize ideas: "+((ballot.celebrations.prizes||"").trim()||"—")+"\n";
  md += "\n## My 3 best things from Q3\n";
  ballot.bestThings.items.forEach((it,i)=>{
    const story = (it.story||"").trim();
    const nPh = (it.photos||[]).length;
    md += "- "+(it.kind?"["+it.kind.charAt(0).toUpperCase()+it.kind.slice(1)+"] ":"")+(story||"—")+
      (nPh?" _("+nPh+" photo"+(nPh===1?"":"s")+" — in the JSON export)_":"")+"\n";
  });
  md += "\n## Legend of the Quarter\n";
  const lgWho = ballot.legend.who ? leaderById(ballot.legend.who) : null;
  md += "- My legend: "+(lgWho?lgWho.name:"—")+"\n";
  md += "- The story: "+((ballot.legend.story||"").trim()||"—")+"\n";
  md += "\n## Action items ("+actionsFor(leader.id).filter(t=>ballot.actions[t]).length+"/"+actionsFor(leader.id).length+" done)\n";
  actionsFor(leader.id).forEach(t=>{ md += "- ["+(ballot.actions[t]?"x":" ")+"] "+t+"\n"; });
  const gw = ballot.goalwork;
  const cards = shortlistFor(leader.id);
  const cardOf = k => cards.find(c=>c.k===k);
  if(BALLOT_UNLOCKED){
  md += "\n## My Q4 goals — my "+pickTargetFor(leader.id)+" ("+gw.picks.length+" picked)\n";
  gw.picks.forEach(k=>{
    const c = cardOf(k) || {name:k};
    const b = gw.bars[k]||{};
    md += "- "+(gw.crits.indexOf(k)!==-1?"⭐ CRITICAL — ":"")+c.name+(c.shared?" _(shared target)_":"")+"\n";
    md += "  - Green: "+((b.green||"").trim()||"—")+"\n  - Super Green: "+((b.superGreen||"").trim()||"—")+"\n  - How measured: "+((b.measure||"").trim()||"—")+"\n";
  });
  const routed = cards.filter(c=>gw.picks.indexOf(c.k)===-1);
  if(routed.length){
    md += "\n## Didn't make my five — routing\n";
    routed.forEach(c=>{
      const r = gw.routes[c.k]||"";
      const label = r.indexOf("direct:")===0 ? "assign to "+r.slice(7) : (r==="park" ? "park — not this quarter" : "room decides");
      md += "- "+c.name+" → "+label+"\n";
    });
  }
  const adds = gw.additions.map((g,i)=>({g,i})).filter(x=>(x.g.name||"").trim());
  if(adds.length){
    md += "\n## Additions (not on the shortlist — flagged for the room)\n";
    adds.forEach(x=>{
      md += "- "+(gw.crits.indexOf("add:"+x.i)!==-1?"⭐ CRITICAL — ":"")+x.g.name.trim()+"\n";
      md += "  - Why: "+((x.g.why||"").trim()||"—")+"\n  - Green: "+((x.g.green||"").trim()||"—")+" · Super Green: "+((x.g.superGreen||"").trim()||"—")+" · How measured: "+((x.g.measure||"").trim()||"—")+"\n";
    });
  }
  }
  if(isDirectSlateLeader(leader.id)){
    md += "\n## Your directs' Q4 slate (drafts — finalized in the room)\n";
    directRosterFor(leader.id).forEach(name=>{
      const ds = directSlateFor(ballot, name);
      const cands = candidatesForDirect(leader, ballot, name).filter(c=>(c.name||"").trim());
      md += "\n### "+name+"\n";
      if(!cands.length){ md += "- No candidates yet\n"; }
      cands.forEach(c=>{
        md += "- "+(c.critical?"⭐ CRITICAL — ":"")+(c.removed?"~~"+c.name+"~~ (removed)":c.name)+(c.source==="routed"?" _(routed from your shortlist)_":"")+"\n";
        if((c.why||"").trim()) md += "  - Why: "+c.why.trim()+"\n";
      });
      if((ds.note||"").trim()) md += "- Note: "+ds.note.trim()+"\n";
    });
  }
  return md;
}
function buildCosPrompt(leader, ballot, d){
  const v = ballot.votes[d.id]||{};
  const head = "You are my thinking partner for the leadership prep at Einstein Moving Company's quarterly QGR (October 2026, Oct 27–28). I'm "+leader.name+", "+leader.role+". Nobody sees my ballot before the room, so be honest, not diplomatic.\n\n";
  if(d.openEnded){
    return head+
      "## The question I've been asked\n"+d.title+"\n\n"+
      "## Context\n"+stripHtml(d.context)+"\n\n"+
      "## The ask\n"+stripHtml(d.debate)+"\n\n"+
      "## My draft answer\n"+((v.reasoning||"").trim()||"(blank — help me build one)")+"\n\n"+
      "## What I need from you\n"+
      "1. Ask me the 3–4 questions that would surface what I actually know here but haven't written down.\n"+
      "2. Push back where my draft is generic — make me name specific people, specific moments, specific numbers.\n"+
      "3. Tell me what I'm likely leaving out because I'm too close to it.\n"+
      "4. Then help me land a tight answer in MY voice — specific, from my seat, no corporate speak.\n\n"+
      "I'll paste the final answer back into my ballot and turn it in on my Meeting OS checklist before the QGR.";
  }
  const posLabel = v.position ? posLabelFor(d, v.position) : "no position yet";
  const optLabels = (d.options||POSITIONS).map(p=>p.label).join(" / ");
  return head+
    "## The question\n"+d.title+"\n\n"+
    "## Context\n"+stripHtml(d.context)+"\n\n"+
    (d.lean
      ? (v.leanRevealed
        ? "## How leadership is currently leaning (a lean, NOT a decision — I'm free to disagree)\n"+stripHtml(d.lean)+"\n\n"
        : "## Leadership's lean is deliberately HIDDEN from you\nA leadership lean exists on this question, but I have not opened it yet — and I'm not giving it to you, so it can't anchor either of us. Help me form my OWN position from my seat first; I'll open the lean afterward and compare.\n\n")
      : "## No lean exists yet\nLeadership has deliberately not written a lean on this one — help me form my own position from scratch.\n\n")+
    "## The debate\n"+stripHtml(d.debate)+"\n\n"+
    "## My draft take\nPosition: "+posLabel+"\nReasoning so far: "+((v.reasoning||"").trim()||"(blank — help me form one)")+"\n\n"+
    "## What I need from you\n"+
    "1. Steelman BOTH sides — the strongest honest case for "+((d.lean&&v.leanRevealed)?"the lean":"each option")+" and the strongest case against it.\n"+
    "2. Pressure-test my draft against what you know about my department and my seat: where does this decision hit MY world, and what would I see go wrong first?\n"+
    "3. Ask me the 2–3 questions that would most change my answer.\n"+
    "4. Then help me land a final position ("+optLabels+") and 3–6 sentences of reasoning in MY voice — specific, from my seat, no corporate speak.\n\n"+
    "I'll paste the final reasoning back into my ballot and turn it in on my Meeting OS checklist before the QGR.";
}

  TRACKS.forEach(t=>{

    "## What I need from you\n"+

    "3. On the gates: push me toward numbers we could actually measure by the end of Q4 with the data we already have. If a gate needs data we don't collect yet, say so — that's a finding worth bringing to the room.\n"+
    "4. Stress-test the manager track specifically: is overseeing the app rollout enough on its own, given they're also carrying sales and hiring? Argue both ways.\n"+
    "5. Give me 3 candidate theme names"+(THEME_WORKING_NAME?" better than \""+THEME_WORKING_NAME+"\"":"")+" — something a mover would actually repeat in a branch huddle.\n\n"+
    "I'll paste the results back into my build sheet and turn it in on my Meeting OS checklist before the QGR.";
  return p;
}
function buildGoalworkCosPrompt(leader, ballot){
  const gw = ballot.goalwork;
  const cards = shortlistFor(leader.id);
  const cardOf = k => cards.find(c=>c.k===k);
  let p = "You are my thinking partner for my Q4 quarterly goals at Einstein Moving Company, going into the October 2026 QGR (Oct 27–28). I'm "+leader.name+", "+leader.role+".\n\n"+
    "## How this works\nThe company already walked the full goal backlog and shortlisted "+cards.length+" candidates for me. My job is to PICK "+pickTargetFor(leader.id)+" I'll actually carry, route the rest, mark my TWO criticals (the ones that, if they slip, my quarter slipped), and write three things for each pick: a GREEN bar (achieved), a SUPER GREEN bar (exceeded), and HOW IT'S MEASURED (the data source and number we'd look at at the Jan 2027 review).\n\n";
  p += "## My shortlist\n";
  cards.forEach(c=>{
    p += "- "+(gw.picks.indexOf(c.k)!==-1?"[PICKED"+(gw.crits.indexOf(c.k)!==-1?" · CRITICAL":"")+"] ":"[not picked] ")+c.name+"\n";
  });
  const pickedWithBars = gw.picks.map(k=>{
    const c = cardOf(k)||{name:k}; const b = gw.bars[k]||{};
    return "### "+c.name+"\nGreen: "+((b.green||"").trim()||"(blank)")+"\nSuper Green: "+((b.superGreen||"").trim()||"(blank)")+"\nHow measured: "+((b.measure||"").trim()||"(blank)")+"\n";
  }).join("\n");
  p += "\n## My draft bars\n"+(pickedWithBars||"(no picks yet — help me choose)")+"\n";
  p += "\n## What I need from you\n"+
    "1. Pressure-test my PICKS first: given my seat and what you know about my quarter, are these the five with the most leverage? If you'd swap one, say which and why.\n"+
    "2. For every bar: make it MEASURABLE. \"Improve X\" is not a bar. Push me to a number, a date, or a binary that a skeptic could grade without asking me.\n"+
    "3. On \"how measured\": name the actual data source. If the data doesn't exist yet, that's a finding — the goal may need a data-collection milestone inside it.\n"+
    "4. Challenge my criticals: are these truly the two that sink the quarter, or just the two I like most?\n"+
    "5. Then hand back tightened bars in MY voice — specific, from my seat, no corporate speak.\n\n"+
    "I'll paste the results back into my hub and turn everything in on my Meeting OS checklist before the QGR.";
  return p;
}
function downloadFile(filename, text, mime){
  const blob = new Blob([text], {type: mime||"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
