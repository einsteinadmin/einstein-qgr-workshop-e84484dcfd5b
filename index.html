<!--
  QGR WORKSHOP HUB — V1 (leader-facing mirror of the QGR Command HQ)
  ==================================================================
  · Sibling surface of index.html (Cameron's HQ) — same brand tokens, same
    qgrhq-q3-2026-v2- localStorage prefix convention, NOT a fork.
  · V1 = the Debate/Ballot module built for real; the rest of the hub is
    link tiles to what already exists.
  · Vote capture is EXPORT-AND-RETURN (the Mover Promotion workshop idiom):
    leader inputs → JSON/markdown export → sends to Cameron → Cameron
    aggregates before the room. Leaders never see each other's votes
    pre-room (anti-anchoring by design — there is nothing to leak because
    nothing is shared).
  · POST-V1 UPGRADE PATH: Replit with a real backend for live aggregation
    (submit → server → Cameron's aggregate view updates in real time).
    V1 deliberately ships without a backend so it can go out this week.
  · SEED REDLINE: the 4 debate questions live in the DEBATES constant at
    the top of the script — Cameron redlines the `lean` text there before
    this goes to leaders. Everything displayed comes from that constant.
  · HOSTING: do NOT deploy until Cameron signs off + a who-sees-what pass
    runs (no TUR diagnostic, no leadership evals, no sensitive comp on
    this page — the financial deck tile deliberately carries NO link).
-->
<style>
:root{
  --orange-50:#FEF6EC; --orange-100:#FDE3C2; --orange-200:#FABD84; --orange-500:#EF8B22; --orange-700:#D96B10; --orange-900:#CC5500;
  --navy-50:#EEF1F4; --navy-100:#CDD5DA; --navy-200:#9AADB7; --navy-400:#507080; --navy-500:#27343D; --navy-700:#1A2329; --navy-900:#0B1014;
  --blue-50:#EBF4FB; --blue-100:#C3DFEF; --blue-500:#0979C3; --blue-700:#065E9A; --blue-900:#023B63;
  --grey-50:#F4F5F5; --grey-100:#E2E3E4; --grey-200:#C0C2C4; --grey-400:#787C7F; --grey-500:#53575A; --grey-700:#363839; --grey-900:#191A1B;
  --success:#69995D; --error:#CC0100; --text-faint:#5F6468;
  --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(39,52,61,.08); --shadow-md:0 4px 12px rgba(39,52,61,.10); --shadow-lg:0 12px 32px rgba(39,52,61,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--grey-700);background:var(--grey-50);font-size:14px;line-height:1.5}
h1,h2,h3,h4{color:var(--navy-500);font-weight:700}
a{color:var(--blue-500)}
button{font:inherit;cursor:pointer}
::selection{background:var(--blue-100)}

#appHeader{background:var(--navy-500);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-md)}
#appHeader .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#appHeader .brand .bebas{font-family:'Bebas Neue','Roboto',sans-serif;font-size:26px;letter-spacing:.03em;color:#fff}
#appHeader .brand .tag{font-size:12px;color:var(--navy-100)}
#appHeader .savebox{font-size:11px;color:var(--navy-100);text-align:right}
#appHeader .savebox b{color:#fff}
main{max-width:1080px;margin:0 auto;padding:24px 20px 90px}
.view{display:none}
.view.active{display:block}
.muted{color:var(--text-faint)}
.small{font-size:12px}
.tiny{font-size:11px}

#storageWarn{display:none;background:#F8DCDC;color:#8E0000;border:1px solid #E6B2B2;border-radius:var(--radius-md);padding:12px 16px;font-size:12.5px;font-weight:700;margin-bottom:16px}
#storageWarn.show{display:block}

/* ---- Landing: who are you ---- */
.landing-intro{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:24px;margin-bottom:20px}
.landing-intro h2{font-size:20px;margin-bottom:6px}
.landing-intro p{font-size:13px;color:var(--grey-500);max-width:760px}
.leader-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.l-card{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;justify-content:space-between;align-items:center;gap:10px}
.l-card .lname{font-size:14px;font-weight:700;color:var(--navy-500)}
.l-card .lrole{font-size:11.5px;color:var(--grey-400)}
.l-card .open-btn{background:var(--navy-500);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 14px;font-size:11.5px;font-weight:700;white-space:nowrap}
.l-card .open-btn:hover{background:var(--navy-700)}
.l-card .started{font-size:10px;color:var(--success);font-weight:700}

/* ---- Anti-anchoring band ---- */
.privacy-band{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius-md);padding:14px 20px;font-size:12.5px;color:var(--blue-900);margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.privacy-band .pb-ico{font-size:16px;line-height:1.3}

/* ---- Hub head + tiles ---- */
.backlink{background:none;border:none;color:var(--blue-500);font-size:12.5px;font-weight:700;padding:0;margin-bottom:14px;display:inline-block}
.hub-head{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:18px 24px;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.hub-head h2{font-size:21px;margin:0}
.hub-head .sub{font-size:12px;color:var(--grey-400);margin-top:2px}
.hub-head .progress-wrap{display:flex;align-items:center;gap:10px}
.progress-track{width:180px;height:8px;background:var(--grey-100);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--orange-500);transition:width .3s}

.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:26px}
.tile{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow-sm)}
.tile h4{font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:5px}
.tile p{font-size:11.5px;color:var(--grey-400);line-height:1.5}
.tile .tlink{font-size:11.5px;font-weight:700;display:inline-block;margin-top:7px}
.tile.live{border-color:var(--orange-200)}
.tile .now{font-size:9.5px;font-weight:700;background:var(--orange-100);color:var(--orange-900);border-radius:var(--radius-pill);padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
.tile .now.pend{background:var(--grey-100);color:var(--grey-400)}
.tile.soft h4,.tile.soft p{color:var(--grey-400)}
.section.pending{opacity:.55}
.section.pending .ai-line{cursor:default}
.tile .soon{font-size:9.5px;font-weight:700;background:var(--grey-100);color:var(--grey-500);border-radius:var(--radius-pill);padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
.tile.soft{border-style:dashed;background:var(--grey-50)}

/* ---- Debate cards ---- */
.section{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:24px;margin-bottom:16px}
.section > .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px;flex-wrap:wrap}
.section h3{font-size:16px;display:flex;align-items:center;gap:8px}
.section .shelp{font-size:12.5px;color:var(--grey-400);margin-bottom:16px;line-height:1.5;max-width:820px}
.section .done-chip{font-size:10.5px;color:var(--success);font-weight:700}

.q-card{border:1px solid var(--grey-100);border-radius:var(--radius-md);margin-bottom:16px;overflow:hidden}
.q-card .qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px;cursor:pointer;user-select:none}
.q-card .qhead:hover .qtitle{color:var(--blue-700)}
.q-card .qtitle{font-size:15px;font-weight:700;color:var(--navy-500)}
.q-card .qnum{color:var(--orange-900);margin-right:4px}
.q-card .caret{font-size:11px;color:var(--grey-400);white-space:nowrap}
.qsum{font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 10px;white-space:nowrap}
.qsum.voted{background:#E3EEDF;color:#3E6636}
.qsum.open{background:var(--grey-100);color:var(--grey-500)}
.q-card.collapsed .qbody{display:none}
.q-card .qbody{padding:0 20px 20px}
.ctx-block{font-size:13px;color:var(--grey-500);line-height:1.65;margin-bottom:12px}
.ctx-block b{color:var(--navy-500)}
.lean-block{background:var(--orange-50);border:1px solid var(--orange-100);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:14px}
.lean-block .lean-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--orange-900);margin-bottom:6px}
.lean-block .lean-body{font-size:13px;color:var(--navy-500);line-height:1.65}
.lean-block .lean-body ul{margin:6px 0 0 18px}
.lean-block .lean-body li{margin-bottom:3px}
details.lean-reveal{margin-bottom:14px}
details.lean-reveal summary{cursor:pointer;list-style:none;user-select:none;font-size:12.5px;font-weight:700;color:var(--blue-500);background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius-sm);padding:9px 14px;display:inline-block}
details.lean-reveal summary::-webkit-details-marker{display:none}
details.lean-reveal summary:hover{border-color:var(--blue-500)}
details.lean-reveal[open] summary{display:none}
details.lean-reveal .lr-hint{font-weight:400;color:var(--navy-400)}
.lean-none{font-size:12.5px;color:var(--navy-500);background:var(--navy-50);border:1px dashed var(--navy-100);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px}
/* action items */
.ai-draft{font-size:10px;font-weight:700;background:var(--orange-100);color:var(--orange-900);border-radius:var(--radius-pill);padding:2px 9px;text-transform:uppercase;letter-spacing:.04em}
.ai-line{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid var(--grey-50);font-size:13px}
.ai-line:first-of-type{border-top:none}
.ai-line input{width:16px;height:16px;margin-top:2px;flex-shrink:0}
.ai-line.done span{color:var(--grey-400);text-decoration:line-through}
/* prework */
.pw-theme{background:var(--orange-50);border:1px solid var(--orange-100);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:14px;font-size:13px;color:var(--navy-500);line-height:1.6}
.pw-goal{border:1px dashed var(--grey-200);border-radius:var(--radius-md);padding:14px 16px;margin-top:12px}
.pw-goal .pw-num{font-size:10.5px;font-weight:700;color:var(--grey-400);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.pw-goal input[type=text]{width:100%;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;font-size:12.5px;margin-bottom:8px}
.pw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.pw-grid{grid-template-columns:1fr}}
.pw-grid textarea{width:100%;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;font-size:12.5px;resize:vertical;min-height:52px}
.debate-line{font-size:13px;color:var(--navy-500);font-weight:700;background:var(--navy-50);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;line-height:1.55}
.debate-line .dl-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-400);display:block;margin-bottom:3px}

.your-take{border-top:1px dashed var(--grey-200);padding-top:14px}
.your-take .yt-label{font-size:12px;font-weight:700;color:var(--navy-500);margin-bottom:8px}
.chiprow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--grey-200);background:#fff;border-radius:var(--radius-sm);padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--grey-500);text-align:center}
.chip:hover{border-color:var(--navy-400)}
.chip.sel{background:var(--navy-500);border-color:var(--navy-500);color:#fff}
.chip.sel.good{background:var(--success);border-color:var(--success)}
.chip.sel.mid{background:var(--orange-700);border-color:var(--orange-700)}
.chip.sel.bad{background:var(--error);border-color:var(--error)}
.chip.sel.und{background:var(--navy-400);border-color:var(--navy-400)}
.q-block{margin-top:10px}
.q-block label{display:block;font-size:12px;font-weight:700;color:var(--navy-500);margin-bottom:3px}
.q-block label .qhint{font-weight:400;color:var(--grey-400)}
.q-block textarea{width:100%;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:9px 11px;font:inherit;font-size:12.5px;resize:vertical;min-height:64px}
.q-block textarea.note-missing{border-color:var(--orange-500);background:var(--orange-50)}
.cos-row{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cos-row button{background:#fff;color:var(--navy-500);border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:8px 14px;font-size:11.5px;font-weight:700}
.cos-row button:hover{border-color:var(--navy-400)}
.cos-row .cos-hint{font-size:11px;color:var(--grey-400)}

/* CHOICES rows */
.row{border-top:1px solid var(--grey-50);padding:14px 0}
.row:first-of-type{border-top:none;padding-top:0}
.row .rowhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.row .rtitle{font-size:13px;font-weight:700;color:var(--navy-500)}
.rownote{width:100%;margin-top:8px;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:7px 10px;font:inherit;font-size:12.5px;resize:vertical;min-height:38px}
.rownote.note-missing{border-color:var(--orange-500);background:var(--orange-50)}
.chip .csub{display:block;font-size:8.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--grey-400);margin-top:1px;line-height:1.1}
.chip.sel .csub{color:rgba(255,255,255,.85)}

/* build sheet — speed-to-competence theme design by role */
.bs-name{background:var(--orange-50);border:1px solid var(--orange-100);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:16px}
.bs-name label{display:block;font-size:12px;font-weight:700;color:var(--navy-500);margin-bottom:5px}
.bs-name input{width:100%;max-width:520px;border:1px solid var(--orange-200);border-radius:var(--radius-sm);padding:9px 12px;font:inherit;font-size:13.5px;font-weight:700;color:var(--navy-500)}
.bs-name .bs-hint{font-size:11.5px;color:var(--grey-500);margin-top:7px;line-height:1.55;max-width:720px}
.track{border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:12px}
.track .thead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.track .thead h4{font-size:13.5px}
.track .tdone{font-size:10.5px;font-weight:700;color:var(--success);margin-left:auto}
.track .tprompt{font-size:12.5px;color:var(--grey-500);line-height:1.6;margin-bottom:9px}
.track .tprompt b{color:var(--navy-500)}
.track textarea{width:100%;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:9px 11px;font:inherit;font-size:12.5px;resize:vertical;min-height:64px}
.gate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:640px){.gate-grid{grid-template-columns:1fr}}
.gate-grid label{display:block;font-size:10.5px;font-weight:700;color:var(--navy-400);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.gate-grid textarea{min-height:48px}
.opt-chip{font-size:9.5px;font-weight:700;background:var(--grey-100);color:var(--grey-500);border-radius:var(--radius-pill);padding:2px 8px;text-transform:uppercase;letter-spacing:.04em;margin-left:7px;vertical-align:middle}
.tgt-chip{font-size:9.5px;font-weight:700;background:var(--blue-50);color:var(--blue-900);border:1px solid var(--blue-100);border-radius:var(--radius-pill);padding:2px 8px;text-transform:uppercase;letter-spacing:.04em;margin-left:7px;vertical-align:middle}

/* export */
.export-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.export-actions button{background:var(--navy-500);color:#fff;border:none;border-radius:var(--radius-sm);padding:11px 20px;font-size:12.5px;font-weight:700}
.export-actions button:hover{background:var(--navy-700)}
.export-actions button.secondary{background:#fff;color:var(--navy-500);border:1px solid var(--grey-200)}
.export-actions button.secondary:hover{border-color:var(--navy-400)}
textarea.mdpreview{width:100%;min-height:140px;margin-top:12px;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:10px;font-family:monospace;font-size:11px;resize:vertical;display:none}
textarea.mdpreview.show{display:block}

footer{background:var(--navy-700);color:var(--navy-100);text-align:center;padding:14px;font-size:11px;position:fixed;bottom:0;left:0;right:0;z-index:40}
.toast{position:fixed;bottom:52px;right:24px;background:var(--navy-500);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:12.5px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(6px);transition:.25s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
@media (max-width:640px){
  #appHeader .savebox{display:none}
  .hub-head .progress-wrap{width:100%}
}
/* ---- Pick-5 goal module ---- */
.gw-counter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gw-pill{font-size:11.5px;font-weight:700;border-radius:var(--radius-pill);padding:4px 12px;background:var(--grey-100);color:var(--grey-500)}
.gw-pill.ok{background:#E3EEDF;color:#3E6636}
.g-card{border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;background:#fff}
.g-card.picked{border-color:var(--orange-200);background:var(--orange-50)}
.g-card .ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.g-card .gname{font-size:13.5px;font-weight:700;color:var(--navy-500);line-height:1.4}
.g-card .gmeta{font-size:10.5px;color:var(--grey-400);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.g-card .gmeta a{font-weight:700}

function getBallot(leader){

  if(!b.prework) b.prework = {own:"",goals:[{},{},{}]};
  while(b.prework.goals.length < 3) b.prework.goals.push({});

  if(!b.goalwork.picks) b.goalwork.picks = [];
  if(!b.goalwork.crits) b.goalwork.crits = [];
  if(!b.goalwork.bars) b.goalwork.bars = {};
  if(!b.goalwork.routes) b.goalwork.routes = {};
  if(!b.goalwork.additions) b.goalwork.additions = [];

/* ============ Progress ============ */
function trackVal(ballot, tid, k){
  const tracks = (ballot && ballot.buildsheet && ballot.buildsheet.tracks) || {};
  return (tracks[tid]||{})[k] || "";
}
/* Build sheet is worth 3 progress points, not one per track — nobody is
   expected to have a real view on all five roles. The three: name the theme,
   write up at least two tracks, set at least one Green/Super Green pair. */
function buildsheetPoints(ballot){
  const bs = ballot && ballot.buildsheet;
  if(!bs) return 0;
  let pts = 0;
  if((bs.themeName||"").trim()) pts++;
  if(TRACKS.filter(t=>trackVal(ballot,t.id,"take").trim()).length >= 2) pts++;
  if(TRACKS.some(t=>t.gate && trackVal(ballot,t.id,"green").trim() && trackVal(ballot,t.id,"superGreen").trim())) pts++;
  return pts;
}
const BUILDSHEET_POINTS = 3;

/* Pick-5 goal module — 3 progress points: picks made · 2 criticals named ·
   every picked goal fully barred (Green + Super Green + How measured). */
function barsComplete(gw, k){
  const b = (gw.bars||{})[k] || {};
  return !!((b.green||"").trim() && (b.superGreen||"").trim() && (b.measure||"").trim());
}
function goalworkPoints(ballot){
  const lid = (ballot && ballot.leader && ballot.leader.id) || null;
  const gw = (ballot && ballot.goalwork) || {};
  const picks = gw.picks || [];
  let pts = 0;
  if(lid && picks.length >= pickTargetFor(lid)) pts++;
  if((gw.crits||[]).length === 2) pts++;
  if(picks.length && picks.every(k=>barsComplete(gw, k))) pts++;
  return pts;
}
const GOALWORK_POINTS = 3;

function ballotProgress(ballot){
  // CORE ballot questions (position + reasoning; open-ended ones are reasoning only)
  // + CHOICES (a score with its note per value) + the build sheet's 3 points.
  // NOTE: callers may pass a RAW stored ballot (e.g. renderLanding), so guard every
  // field here — a legacy save missing `choices`/`votes` must never throw and blank the page.
  const lid = (ballot && ballot.leader && ballot.leader.id) || null;
  const core = debatesFor(lid).filter(isCore);
  const votes = (ballot && ballot.votes) || {};
  const items = (ballot && ballot.choices && ballot.choices.items) || {};
  const notes = (ballot && ballot.choices && ballot.choices.itemNotes) || {};
  let done = 0;
  let total = core.reduce((n,d)=>n + (d.openEnded?1:2), 0) + CORE_VALUES.length + BUILDSHEET_POINTS + GOALWORK_POINTS;
  core.forEach(d=>{
    const v = votes[d.id]||{};
    if(!d.openEnded && v.position) done++;
    if((v.reasoning||"").trim()) done++;
  });
  CORE_VALUES.forEach(cv=>{ if(items[cv] && (notes[cv]||"").trim()) done++; });
  done += buildsheetPoints(ballot);
  done += goalworkPoints(ballot);
  return total ? Math.round(done/total*100) : 0;
}
function choicesDone(ballot){ return CORE_VALUES.every(cv=>ballot.choices.items[cv]); }
function questionAnswered(ballot, d){
  const v = ballot.votes[d.id]||{};
  return (d.openEnded || !!v.position) && !!(v.reasoning||"").trim();
}
function votedCount(ballot, leaderId){
  return debatesFor(leaderId).filter(d=>questionAnswered(ballot, d)).length;
}
function coreOpenCount(ballot, leaderId){
  return debatesFor(leaderId).filter(d=>isCore(d) && !questionAnswered(ballot, d)).length;
}

        '<div><label>Super Green</label><textarea data-gbar="'+esc(c.k)+':superGreen" placeholder="What does exceeded look like?">'+esc(bars.superGreen||"")+'</textarea></div>'+

        '<select data-groute="'+esc(c.k)+'">'+

      '<input type="text" data-gadd="'+i+':name" value="'+esc(g.name||"")+'" placeholder="Goal name — one line">'+
      '<textarea data-gadd="'+i+':why" placeholder="Why this belongs on the slate even though the shortlist walk didn\'t surface it — the room will ask.">'+esc(g.why||"")+'</textarea>'+
      '<div class="gbars">'+
      '<div><label>Green</label><textarea data-gadd="'+i+':green" placeholder="What does achieved look like?">'+esc(g.green||"")+'</textarea></div>'+
      '<div><label>Super Green</label><textarea data-gadd="'+i+':superGreen" placeholder="What does exceeded look like?">'+esc(g.superGreen||"")+'</textarea></div>'+
      '<div><label>How measured</label><textarea data-gadd="'+i+':measure" placeholder="Data source + number">'+esc(g.measure||"")+'</textarea></div>'+
      '</div></div>';
  });
  html += '<button id="btnAddGoal">＋ Add a goal that isn\'t on the shortlist <span class="tiny muted">&mdash; it gets flagged for the room; it doesn\'t cost you one of your five</span></button>';
  html += '<div class="cos-row" style="margin-top:14px"><button id="btnGwCos">🎙 Copy COS prompt for your goals</button>'+
    '<span class="cos-hint">Hands your five picks and draft bars to your AI chief of staff to sharpen — measurable beats ambitious-sounding.</span></div>';

  return html;

/* ============ Wiring ============ */
function wireHub(leader, ballot){
  const wrap = document.getElementById("view-hub");
  document.getElementById("backBtn").addEventListener("click", backToLanding);

  wrap.querySelectorAll("[data-scrollto]").forEach(a=>{
    a.addEventListener("click", (e)=>{
      e.preventDefault();
      const el = document.getElementById(a.dataset.scrollto);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  wrap.querySelectorAll("[data-qtoggle]").forEach(h=>{
    h.addEventListener("click", (e)=>{
      if(e.target.closest("button,textarea,a")) return;
      const id = h.dataset.qtoggle;
      if(EXPANDED.has(id)) EXPANDED.delete(id); else EXPANDED.add(id);
      renderHub();
    });
  });
  wrap.querySelectorAll("[data-pos]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.pos, val = btn.dataset.val;
      if(!ballot.votes[id]) ballot.votes[id] = {};
      ballot.votes[id].position = ballot.votes[id].position===val ? null : val;
      queueSave(); renderHub();
    });
  });
  wrap.querySelectorAll("[data-reason]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const id = ta.dataset.reason;
      if(!ballot.votes[id]) ballot.votes[id] = {};
      ballot.votes[id].reasoning = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-action]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      if(cb.checked) ballot.actions[cb.dataset.action] = true;
      else delete ballot.actions[cb.dataset.action];
      queueSave(); renderHub();
    });
  });
  /* ---- Pick-5 goal module ---- */
  const gw = ballot.goalwork;
  wrap.querySelectorAll("[data-gpick]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.gpick;
      const i = gw.picks.indexOf(k);
      if(i !== -1){
        gw.picks.splice(i,1);
        const ci = gw.crits.indexOf(k); if(ci !== -1) gw.crits.splice(ci,1);
      } else {
        if(gw.picks.length >= pickTargetFor(leader.id)){
          toast("That's "+pickTargetFor(leader.id)+" already — unpick one first. Cut, don't collect.");
          return;
        }
        gw.picks.push(k);
        delete gw.routes[k];
      }
      queueSave(); renderHub();
    });
  });
  wrap.querySelectorAll("[data-gcrit]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.gcrit;
      const i = gw.crits.indexOf(k);
      if(i !== -1) gw.crits.splice(i,1);
      else {
        if(gw.crits.length >= 2){ toast("Two criticals max — that's the point. Swap one out."); return; }
        gw.crits.push(k);
      }
      queueSave(); renderHub();
    });
  });
  wrap.querySelectorAll("[data-gbar]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const idx = ta.dataset.gbar.lastIndexOf(":");
      const k = ta.dataset.gbar.slice(0,idx), f = ta.dataset.gbar.slice(idx+1);
      if(!gw.bars[k]) gw.bars[k] = {};
      gw.bars[k][f] = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-groute]").forEach(sel=>{
    sel.addEventListener("change", ()=>{
      if(sel.value) gw.routes[sel.dataset.groute] = sel.value;
      else delete gw.routes[sel.dataset.groute];
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-gadd]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const idx = el.dataset.gadd.indexOf(":");
      const i = Number(el.dataset.gadd.slice(0,idx)), f = el.dataset.gadd.slice(idx+1);
      if(!gw.additions[i]) gw.additions[i] = {};
      gw.additions[i][f] = el.value;
      queueSave();
    });
  });
  const addBtn = document.getElementById("btnAddGoal");
  if(addBtn) addBtn.addEventListener("click", ()=>{ gw.additions.push({}); queueSave(); renderHub(); });
  wrap.querySelectorAll("[data-gdel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const i = Number(btn.dataset.gdel);
      gw.additions.splice(i,1);
      // crit keys for additions are positional — drop the removed one, shift the rest
      gw.crits = gw.crits.filter(k=>k!=="add:"+i).map(k=>{
        if(k.indexOf("add:")===0){ const n = Number(k.slice(4)); if(n>i) return "add:"+(n-1); }
        return k;
      });
      queueSave(); renderHub();
    });
  });
  const gwCos = document.getElementById("btnGwCos");
  if(gwCos) gwCos.addEventListener("click", ()=>{
    copyText(buildGoalworkCosPrompt(leader, ballot), "Goals COS prompt copied — paste it to your AI chief of staff");
  });
  wrap.querySelectorAll("[data-cv]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const cv = btn.dataset.cv, val = btn.dataset.val;
      if(ballot.choices.items[cv]===val) delete ballot.choices.items[cv];
      else ballot.choices.items[cv] = val;
      queueSave(); renderHub();
    });
  });
  wrap.querySelectorAll("[data-cvnote]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      ballot.choices.itemNotes[ta.dataset.cvnote] = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-celeb]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      ballot.celebrations[ta.dataset.celeb] = ta.value;
      queueSave();
    });
  });
  const bsName = wrap.querySelector("[data-bsname]");
  if(bsName) bsName.addEventListener("input", ()=>{ ballot.buildsheet.themeName = bsName.value; queueSave(); });
  wrap.querySelectorAll("[data-track]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const idx = el.dataset.track.indexOf(":");
      const tid = el.dataset.track.slice(0,idx), k = el.dataset.track.slice(idx+1);
      if(!ballot.buildsheet.tracks[tid]) ballot.buildsheet.tracks[tid] = {};
      ballot.buildsheet.tracks[tid][k] = el.value;
      queueSave();
    });
  });
  const bsCos = document.getElementById("btnBsCos");
  if(bsCos) bsCos.addEventListener("click", ()=>{
    copyText(buildBuildsheetCosPrompt(leader, ballot), "Build-sheet COS prompt copied — paste it to your AI chief of staff");
  });
  wrap.querySelectorAll("[data-cos]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const d = DEBATES.find(x=>x.id===btn.dataset.cos);
      const prompt = buildCosPrompt(leader, ballot, d);
      copyText(prompt, "COS prompt copied — paste it to your AI chief of staff");
    });
  });
  document.getElementById("btnJson").addEventListener("click", ()=>{
    const openCore = coreOpenCount(ballot, leader.id);
    downloadFile("qgr-ballot-"+leader.id+"-q3-2026.json", JSON.stringify(buildJsonBallot(leader, ballot), null, 2), "application/json");
    toast(openCore ? "Ballot downloaded — heads up, "+openCore+" must-answer question"+(openCore>1?"s":"")+" still incomplete" : "Ballot downloaded — send the file to Cameron");
  });
  document.getElementById("btnMd").addEventListener("click", ()=>{
    const md = buildMarkdown(leader, ballot);
    const pv = document.getElementById("mdPreview");
    pv.value = md; pv.classList.add("show");
    copyText(md, "Markdown copied");
  });
  document.getElementById("btnMdPreview").addEventListener("click", ()=>{
    const pv = document.getElementById("mdPreview");
    pv.value = buildMarkdown(leader, ballot); pv.classList.toggle("show");
  });
}
function copyText(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast(okMsg), ()=>toast("Copy blocked — select it from the preview below"));
  } else {
    const pv = document.getElementById("mdPreview");
    if(pv){ pv.value = text; pv.classList.add("show"); }
    toast("Copy not available in this browser — select it from the preview below");
  }
}

/* ============ Export builders ============ */
function buildJsonBallot(leader, ballot){
  return {
    schema: "einstein-qgr-ballot/v5",
    exportedAt: new Date().toISOString(),
    quarter: QUARTER,
    leader: { id: leader.id, name: leader.name, role: leader.role },
    choices: CORE_VALUES.map(cv=>({ value: cv, score: ballot.choices.items[cv]?Number(ballot.choices.items[cv]):null, note: (ballot.choices.itemNotes[cv]||"").trim() })),
    celebrations: { celebration: (ballot.celebrations.celebration||"").trim(), prizes: (ballot.celebrations.prizes||"").trim() },
    actionItems: actionsFor(leader.id).map(t=>({ item: t, done: !!ballot.actions[t] })),
    goals: (function(){
      const gw = ballot.goalwork;
      const cards = shortlistFor(leader.id);
      const cardOf = k => cards.find(c=>c.k===k);
      return {
        pickTarget: pickTargetFor(leader.id),
        picked: gw.picks.map(k=>{
          const c = cardOf(k) || {name:k};
          const b = gw.bars[k]||{};
          return { key:k, name:c.name, pulse:c.pulse||null, shared:c.shared||null,
                   critical: gw.crits.indexOf(k)!==-1,
                   green:(b.green||"").trim(), superGreen:(b.superGreen||"").trim(), howMeasured:(b.measure||"").trim() };
        }),
        routed: cards.filter(c=>gw.picks.indexOf(c.k)===-1).map(c=>({
          key:c.k, name:c.name, pulse:c.pulse||null,
          route: gw.routes[c.k]||"room-decides"
        })),
        additions: gw.additions.map((g,i)=>({
          name:(g.name||"").trim(), why:(g.why||"").trim(),
          critical: gw.crits.indexOf("add:"+i)!==-1, flaggedForRoom: true,
          green:(g.green||"").trim(), superGreen:(g.superGreen||"").trim(), howMeasured:(g.measure||"").trim()
        })).filter(g=>g.name)
      };
    })(),
    // legacy pre-v1.8 scaffold — carried only if an old save actually wrote something there
    legacyPrework: (function(){
      const pw = ballot.prework||{};
      const goals = (pw.goals||[]).filter(g=>(g.idea||"").trim()||(g.green||"").trim()||(g.superGreen||"").trim());
      if(!(pw.own||"").trim() && !goals.length) return null;
      return { themeOwnership:(pw.own||"").trim(),
               draftGoals: goals.map(g=>({ idea:(g.idea||"").trim(), green:(g.green||"").trim(), superGreen:(g.superGreen||"").trim() })) };
    })(),
    buildsheet: {
      themeName: (ballot.buildsheet.themeName||"").trim(),
      workingName: THEME_WORKING_NAME,
      tracks: TRACKS.map(t=>({
        id: t.id, label: t.label,
        take: trackVal(ballot,t.id,"take").trim(),
        green: t.gate ? trackVal(ballot,t.id,"green").trim() : null,
        superGreen: t.gate ? trackVal(ballot,t.id,"superGreen").trim() : null
      })).filter(t=>t.take || t.green || t.superGreen)
    },
    ballot: debatesFor(leader.id).map(d=>{
      const v = ballot.votes[d.id]||{};
      return {
        id: d.id, title: d.title,
        core: isCore(d),
        openEnded: !!d.openEnded,
        targeted: !!d.forLeaders,
        question: stripHtml(d.debate),
        leanShown: d.lean ? stripHtml(d.lean) : null,   // snapshot of the lean the leader saw (null = no lean written, by design)
        position: v.position||null,
        positionLabel: v.position ? posLabelFor(d, v.position) : null,
        reasoning: (v.reasoning||"").trim()
      };
    }),
    startedAt: ballot.startedAt||null
  };
}
function buildMarkdown(leader, ballot){
  const d = new Date().toISOString().slice(0,10);
  let md = "# QGR Ballot — "+leader.name+" — "+d+"\n*"+leader.role+" · Q3 2026 QGR (7/29–30)*\n\n";
  debatesFor(leader.id).forEach((q,i)=>{
    const v = ballot.votes[q.id]||{};
    md += "## "+(i+1)+" · "+q.title+(isCore(q)?"":" _(optional)_")+"\n";
    md += "- The "+(q.openEnded?"ask":"debate")+": "+stripHtml(q.debate)+"\n";
    if(!q.openEnded) md += "- **My position: "+(v.position ? posLabelFor(q, v.position) : "—")+"**\n";
    md += "- My "+(q.openEnded?"answer":"reasoning")+": "+((v.reasoning||"").trim()||"—")+"\n\n";
  });
  const bs = ballot.buildsheet;
  md += "## Speed to competence — build sheet\n";
  md += "- Theme name: "+((bs.themeName||"").trim()||"— (working name: "+THEME_WORKING_NAME+")")+"\n";
  TRACKS.forEach(t=>{
    const take = trackVal(ballot,t.id,"take").trim();
    const green = trackVal(ballot,t.id,"green").trim();
    const sg = trackVal(ballot,t.id,"superGreen").trim();
    if(!take && !green && !sg) return;
    md += "- **"+t.label+":** "+(take||"—")+"\n";
    if(t.gate && (green||sg)) md += "  - Green: "+(green||"—")+" · Super Green: "+(sg||"—")+"\n";
  });
  md += "\n";
  md += "## CHOICES self-eval (1–5)\n";
  CORE_VALUES.forEach(cv=>{
    const s = ballot.choices.items[cv], note = (ballot.choices.itemNotes[cv]||"").trim();
    md += "- "+cv+": "+(s||"—")+(note?" — "+note:"")+"\n";
  });
  md += "\n## Celebrations & prizes (Q3 theme)\n";
  md += "- Celebration ideas: "+((ballot.celebrations.celebration||"").trim()||"—")+"\n";
  md += "- Prize ideas: "+((ballot.celebrations.prizes||"").trim()||"—")+"\n";
  md += "\n## Action items ("+actionsFor(leader.id).filter(t=>ballot.actions[t]).length+"/"+actionsFor(leader.id).length+" done)\n";
  actionsFor(leader.id).forEach(t=>{ md += "- ["+(ballot.actions[t]?"x":" ")+"] "+t+"\n"; });
  const gw = ballot.goalwork;
  const cards = shortlistFor(leader.id);
  const cardOf = k => cards.find(c=>c.k===k);
  md += "\n## My Q3 goals — my "+pickTargetFor(leader.id)+" ("+gw.picks.length+" picked)\n";
  gw.picks.forEach(k=>{
    const c = cardOf(k) || {name:k};
    const b = gw.bars[k]||{};
    md += "- "+(gw.crits.indexOf(k)!==-1?"⭐ CRITICAL — ":"")+c.name+(c.shared?" _(shared target)_":"")+"\n";
    md += "  - Green: "+((b.green||"").trim()||"—")+"\n  - Super Green: "+((b.superGreen||"").trim()||"—")+"\n  - How measured: "+((b.measure||"").trim()||"—")+"\n";
  });
  const routed = cards.filter(c=>gw.picks.indexOf(c.k)===-1);
  if(routed.length){
    md += "\n## Didn't make my five — routing\n";
    routed.forEach(c=>{
      const r = gw.routes[c.k]||"";
      const label = r.indexOf("direct:")===0 ? "assign to "+r.slice(7) : (r==="park" ? "park — not this quarter" : "room decides");
      md += "- "+c.name+" → "+label+"\n";
    });
  }
  const adds = gw.additions.map((g,i)=>({g,i})).filter(x=>(x.g.name||"").trim());
  if(adds.length){
    md += "\n## Additions (not on the shortlist — flagged for the room)\n";
    adds.forEach(x=>{
      md += "- "+(gw.crits.indexOf("add:"+x.i)!==-1?"⭐ CRITICAL — ":"")+x.g.name.trim()+"\n";
      md += "  - Why: "+((x.g.why||"").trim()||"—")+"\n  - Green: "+((x.g.green||"").trim()||"—")+" · Super Green: "+((x.g.superGreen||"").trim()||"—")+" · How measured: "+((x.g.measure||"").trim()||"—")+"\n";
    });
  }
  return md;
}
function buildCosPrompt(leader, ballot, d){
  const v = ballot.votes[d.id]||{};
  const head = "You are my thinking partner for the leadership prep at Einstein Moving Company's quarterly QGR (July 29–30). I'm "+leader.name+", "+leader.role+". Nobody sees my ballot before the room, so be honest, not diplomatic.\n\n";
  if(d.openEnded){
    return head+
      "## The question I've been asked\n"+d.title+"\n\n"+
      "## Context\n"+stripHtml(d.context)+"\n\n"+
      "## The ask\n"+stripHtml(d.debate)+"\n\n"+
      "## My draft answer\n"+((v.reasoning||"").trim()||"(blank — help me build one)")+"\n\n"+
      "## What I need from you\n"+
      "1. Ask me the 3–4 questions that would surface what I actually know here but haven't written down.\n"+
      "2. Push back where my draft is generic — make me name specific people, specific moments, specific numbers.\n"+
      "3. Tell me what I'm likely leaving out because I'm too close to it.\n"+
      "4. Then help me land a tight answer in MY voice — specific, from my seat, no corporate speak.\n\n"+
      "I'll paste the final answer back into my ballot and export it to Cameron before the QGR.";
  }
  const posLabel = v.position ? posLabelFor(d, v.position) : "no position yet";
  const optLabels = (d.options||POSITIONS).map(p=>p.label).join(" / ");
  return head+
    "## The question\n"+d.title+"\n\n"+
    "## Context\n"+stripHtml(d.context)+"\n\n"+
    (d.lean
      ? "## How leadership is currently leaning (a lean, NOT a decision — I'm free to disagree)\n"+stripHtml(d.lean)+"\n\n"
      : "## No lean exists yet\nLeadership has deliberately not written a lean on this one — help me form my own position from scratch.\n\n")+
    "## The debate\n"+stripHtml(d.debate)+"\n\n"+
    "## My draft take\nPosition: "+posLabel+"\nReasoning so far: "+((v.reasoning||"").trim()||"(blank — help me form one)")+"\n\n"+
    "## What I need from you\n"+
    "1. Steelman BOTH sides — the strongest honest case for "+(d.lean?"the lean":"each option")+" and the strongest case against it.\n"+
    "2. Pressure-test my draft against what you know about my department and my seat: where does this decision hit MY world, and what would I see go wrong first?\n"+
    "3. Ask me the 2–3 questions that would most change my answer.\n"+
    "4. Then help me land a final position ("+optLabels+") and 3–6 sentences of reasoning in MY voice — specific, from my seat, no corporate speak.\n\n"+
    "I'll paste the final reasoning back into my ballot and export it to Cameron before the QGR.";
}
function buildBuildsheetCosPrompt(leader, ballot){
  const bs = ballot.buildsheet;
  let p = "You are my thinking partner for the Q3 planning at Einstein Moving Company's quarterly QGR (July 29–30). I'm "+leader.name+", "+leader.role+".\n\n"+
    "## The theme\nLeadership is converging on Q3 = SPEED TO COMPETENCE, for everyone — movers, leads, managers, and CX reps, not just the field. The working name is \""+THEME_WORKING_NAME+"\" and it's beatable.\n\n"+
    "The trap we're trying to avoid: a theme that just means \"finish the mover training app\" only reaches leads who are currently in training, and nobody else. So the real design question is what this theme means for EVERY role, and what gates we'd grade the quarter against.\n\n"+
    "## The tracks I've been asked to think through\n";
  TRACKS.forEach(t=>{
    p += "\n### "+t.label+(t.gate?" (needs a Green and Super Green gate)":"")+"\n"+stripHtml(t.prompt)+"\n";
    const take = trackVal(ballot,t.id,"take").trim();
    const green = trackVal(ballot,t.id,"green").trim();
    const sg = trackVal(ballot,t.id,"superGreen").trim();
    p += "My draft: "+(take||"(blank)")+"\n";
    if(t.gate) p += "My draft gates — Green: "+(green||"(blank)")+" · Super Green: "+(sg||"(blank)")+"\n";
  });
  p += "\n## My theme name idea\n"+((bs.themeName||"").trim()||"(blank — working name is \""+THEME_WORKING_NAME+"\")")+"\n\n"+
    "## What I need from you\n"+
    "1. Work the tracks where I have real standing — you know my seat. Don't make me fake expertise on roles I don't touch; tell me which ones I should leave to someone else.\n"+
    "2. For every track we do work: make it CONCRETE. Who does what, how often, and how we'd know it happened. \"More training\" is not an answer.\n"+
    "3. On the gates: push me toward numbers we could actually measure by the end of Q3 with the data we already have. If a gate needs data we don't collect yet, say so — that's a finding worth bringing to the room.\n"+
    "4. Stress-test the manager track specifically: is overseeing the app rollout enough on its own, given they're also carrying sales and hiring? Argue both ways.\n"+
    "5. Give me 3 candidate theme names better than \""+THEME_WORKING_NAME+"\" — something a mover would actually repeat in a branch huddle.\n\n"+
    "I'll paste the results back into my build sheet and export it to Cameron before the QGR.";
  return p;
}
function buildGoalworkCosPrompt(leader, ballot){
  const gw = ballot.goalwork;
  const cards = shortlistFor(leader.id);
  const cardOf = k => cards.find(c=>c.k===k);
  let p = "You are my thinking partner for my Q3 quarterly goals at Einstein Moving Company, going into the QGR (July 29–30). I'm "+leader.name+", "+leader.role+".\n\n"+
    "## How this works\nThe company already walked the full goal backlog and shortlisted "+cards.length+" candidates for me. My job is to PICK "+pickTargetFor(leader.id)+" I'll actually carry, route the rest, mark my TWO criticals (the ones that, if they slip, my quarter slipped), and write three things for each pick: a GREEN bar (achieved), a SUPER GREEN bar (exceeded), and HOW IT'S MEASURED (the data source and number we'd look at on Oct 1).\n\n";
  p += "## My shortlist\n";
  cards.forEach(c=>{
    p += "- "+(gw.picks.indexOf(c.k)!==-1?"[PICKED"+(gw.crits.indexOf(c.k)!==-1?" · CRITICAL":"")+"] ":"[not picked] ")+c.name+"\n";
  });
  const pickedWithBars = gw.picks.map(k=>{
    const c = cardOf(k)||{name:k}; const b = gw.bars[k]||{};
    return "### "+c.name+"\nGreen: "+((b.green||"").trim()||"(blank)")+"\nSuper Green: "+((b.superGreen||"").trim()||"(blank)")+"\nHow measured: "+((b.measure||"").trim()||"(blank)")+"\n";
  }).join("\n");
  p += "\n## My draft bars\n"+(pickedWithBars||"(no picks yet — help me choose)")+"\n";
  p += "\n## What I need from you\n"+
    "1. Pressure-test my PICKS first: given my seat and what you know about my quarter, are these the five with the most leverage? If you'd swap one, say which and why.\n"+
    "2. For every bar: make it MEASURABLE. \"Improve X\" is not a bar. Push me to a number, a date, or a binary that a skeptic could grade without asking me.\n"+
    "3. On \"how measured\": name the actual data source. If the data doesn't exist yet, that's a finding — the goal may need a data-collection milestone inside it.\n"+
    "4. Challenge my criticals: are these truly the two that sink the quarter, or just the two I like most?\n"+
    "5. Then hand back tightened bars in MY voice — specific, from my seat, no corporate speak.\n\n"+
    "I'll paste the results back into my hub and export everything to Cameron before the QGR.";
  return p;
}
function downloadFile(filename, text, mime){
  const blob = new Blob([text], {type: mime||"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
